[pytest]
# 기본 실행에서는 외부 서비스가 필요한 통합 테스트를 뺀다. 서버에서만 `-m integration`으로 돌린다.
addopts = -m "not integration"
markers =
    integration: 실제 OpenSearch 등 외부 서비스가 필요한 테스트 (서버에서만 실행)
testpaths = tests
# `from app...`, `from tests.conftest import ...`가 되도록 프로젝트 루트를 import 경로에 넣는다.
pythonpath = .
# async def 테스트(Task 14의 API 테스트)를 마커 없이 돌린다.
asyncio_mode = auto
# pytest-asyncio가 요구하는 명시 설정(없으면 경고가 나온다): 비동기 픽스처도 테스트마다 새 이벤트 루프를 쓴다.
asyncio_default_fixture_loop_scope = function
